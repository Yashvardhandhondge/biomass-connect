<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pellet Order Tracking | Manufacturer | Biomass Connect</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/manufacturer/tracking.css">
</head>

<body data-role="manufacturer" data-page="pellet-tracking">

    <div class="app-shell">

        <aside class="sidebar" id="sidebar"></aside>

        <div class="app-main">

            <header class="topbar" id="topbar"></header>

            <main class="page">

                <div class="page-header">
                    <div>
                        <h1>Pellet Order Tracking</h1>
                        <p class="page-subtitle">Dispatch accepted pellet orders and update their delivery status.</p>
                    </div>
                    <div class="page-actions">
                        <a class="btn btn-secondary" href="pellet-orders.html">
                            <i class="fa-solid fa-cart-shopping"></i> Orders Received
                        </a>
                    </div>
                </div>

                <div class="kpi-grid">
                    <div class="kpi-card">
                        <div class="kpi-icon"><i class="fa-solid fa-truck-ramp-box"></i></div>
                        <div>
                            <div class="kpi-value" id="kpiReady">0</div>
                            <div class="kpi-label">Ready to Dispatch</div>
                        </div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-icon"><i class="fa-solid fa-truck-fast"></i></div>
                        <div>
                            <div class="kpi-value" id="kpiTransit">0</div>
                            <div class="kpi-label">In Transit</div>
                        </div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-icon"><i class="fa-solid fa-calendar-day"></i></div>
                        <div>
                            <div class="kpi-value" id="kpiDue">0</div>
                            <div class="kpi-label">Due in Next 7 Days</div>
                        </div>
                    </div>
                    <div class="kpi-card">
                        <div class="kpi-icon"><i class="fa-solid fa-circle-check"></i></div>
                        <div>
                            <div class="kpi-value" id="kpiDelivered">0</div>
                            <div class="kpi-label">Delivered</div>
                        </div>
                    </div>
                </div>

                <div class="track-layout">

                    <section class="card">
                        <div class="card-header">
                            <div>
                                <div class="card-title">Shipments</div>
                                <div class="card-subtitle">Accepted, in-transit and delivered orders</div>
                            </div>
                        </div>
                        <div class="card-body track-search">
                            <div class="toolbar" style="margin-bottom:0">
                                <div class="search">
                                    <i class="fa-solid fa-magnifying-glass"></i>
                                    <input type="search" id="orderSearch" placeholder="Search order, power plant" data-novalidate>
                                </div>
                            </div>
                        </div>
                        <div class="order-list" id="orderList"></div>
                    </section>

                    <section class="card" id="trackDetail"></section>

                </div>

            </main>

        </div>

    </div>

    <!-- DISPATCH MODAL -->

    <div class="modal-backdrop" id="dispatchModal">
        <div class="modal" role="dialog" aria-modal="true" aria-labelledby="dispatchTitle">
            <div class="modal-header">
                <h3 id="dispatchTitle">Dispatch order</h3>
                <button class="modal-close" type="button" data-close aria-label="Close"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <form id="dispatchForm" novalidate>
                <div class="modal-body">
                    <p class="text-muted mb-2" id="dispatchInfo"></p>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="vehicleNo">Vehicle Number</label>
                            <input type="text" id="vehicleNo" placeholder="e.g. MH15AB1234" maxlength="13" data-filter="upper"
                                   data-label="Vehicle number" data-rules="required|vehicle">
                        </div>
                        <div class="form-group">
                            <label for="transporter">Transporter <span class="text-subtle">(optional)</span></label>
                            <input type="text" id="transporter" placeholder="e.g. Shree Logistics"
                                   data-label="Transporter" data-rules="text|minlen:2|maxlen:100">
                        </div>
                        <div class="form-group">
                            <label for="driverName">Driver Name</label>
                            <input type="text" id="driverName" placeholder="Full name" data-label="Driver name" data-rules="required|name">
                        </div>
                        <div class="form-group">
                            <label for="driverMobile">Driver Mobile</label>
                            <input type="tel" id="driverMobile" placeholder="10-digit mobile" inputmode="numeric"
                                   data-label="Driver mobile" data-rules="required|mobile">
                        </div>
                        <div class="form-group">
                            <label for="dispatchDate">Dispatch Date</label>
                            <input type="date" id="dispatchDate" data-label="Dispatch date" data-rules="required|date|notFuture">
                        </div>
                        <div class="form-group">
                            <label for="expectedDate">Expected Delivery</label>
                            <input type="date" id="expectedDate" data-label="Expected delivery"
                                   data-rules="required|date|notPast|after:#dispatchDate|maxDate:+60">
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-close>Cancel</button>
                    <button type="submit" class="btn btn-primary"><i class="fa-solid fa-truck-fast"></i> Mark as Dispatched</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/common/toast.js"></script>
    <script src="../js/common/validation.js"></script>
    <script src="../js/common/store.js"></script>
    <script src="../js/common/layout.js"></script>
    <script src="../js/manufacturer/pellet-tracking.js"></script>

</body>

</html>
